name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check that the tag matches the mod version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match mod_version $version"
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: inventory-searcher
          path: build/libs/*.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/libs/*.jar \
            --title "Inventory Searcher ${GITHUB_REF_NAME#v}" \
            --notes "For Minecraft 26.3. Only requires Fabric Loader. Put the jar into your mods folder."
